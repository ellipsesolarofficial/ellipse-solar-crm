<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ellipse Solar</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body data-page="login">
  <header class="bar">
    <a class="brand" href="/login">Ellipse Solar</a>
  </header>
  <main class="login">
    <h1>Sign in</h1>
    <p class="muted">Use the employee name and the 8–12 digit PIN from your admin.</p>
    <form id="loginForm">
      <label>Employee name
        <input name="name" autocomplete="username" required>
      </label>
      <label>PIN
        <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="8" maxlength="12" required>
      </label>
      <button class="btn" type="submit">Sign in</button>
      <p id="error" class="error" role="alert"></p>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
